<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro TV & Internet Archive VHS Vault</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for In-Browser JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .woodgrain { 
      background-image: repeating-linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 10px, transparent 10px, transparent 20px); 
    }
    .crt-scanlines::before {
      content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; z-index: 20; pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
      background-size: 100% 3px, 3px 100%;
    }
    .static-noise {
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.85; animation: staticFlicker 0.1s infinite;
    }
    @keyframes staticFlicker {
      0% { background-position: 0 0; } 20% { background-position: -15% 5%; } 40% { background-position: 20% 25%; }
      60% { background-position: 15% 5%; } 80% { background-position: 25% 35%; } 100% { background-position: 0 0; }
    }
    .vcr-font {
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 1px 1px 0px #000;
    }
    .vhs-tracking {
      animation: trackingJitter 2s infinite alternate ease-in-out;
    }
    @keyframes trackingJitter {
      0% { transform: translateY(0px) skewX(0deg); }
      95% { transform: translateY(0px) skewX(0deg); }
      97% { transform: translateY(-2px) skewX(0.5deg); }
      100% { transform: translateY(1px) skewX(-0.3deg); }
    }
    .pseudo-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
      border-radius: 0 !important;
      border: none !important;
      max-width: none !important;
      max-height: none !important;
    }
    :fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      max-width: none !important;
      max-height: none !important;
      aspect-ratio: auto !important;
    }
    :-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      max-width: none !important;
      max-height: none !important;
      aspect-ratio: auto !important;
    }
  </style>
</head>
<body class="bg-[#121214] text-white min-h-screen font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const Power = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
    );
    const ChevronUp = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    );
    const ChevronDown = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    );
    const Search = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    );
    const Play = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    );
    const X = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    );
    const Tv = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/>
      </svg>
    );
    const Loader2 = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
    );
    const Disc = ({ className, style }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
      </svg>
    );
    const Clapperboard = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M4 11v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8H4z"/><path d="M4 11V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4H4z"/><path d="m9 5 3 6"/><path d="m14 5 3 6"/><path d="m4 5 3 6"/>
      </svg>
    );
    const Eye = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
    );
    const Maximize = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    );
    const Minimize = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
      </svg>
    );

    const curatedChannels = [
      // 1950s
      { source: 'youtube', type: 'video', id: 'sjdnCC6n4xk', decade: '50s', category: 'Cartoons', title: 'Superman (Classic 1950s)' },
      { source: 'youtube', type: 'video', id: 'kWKxJ0E6Y6E', decade: '50s', category: 'Movies', title: 'House on Haunted Hill (1959)' }, 
      { source: 'youtube', type: 'video', id: '9rXv8eW3yU4', decade: '50s', category: 'Commercials', title: '1950s Live TV Broadcast Ads' },
      // 1960s
      { source: 'youtube', type: 'video', id: '1b1G-nI8xZ8', decade: '60s', category: 'News', title: 'CBS Apollo 11 Live Broadcast' },
      { source: 'youtube', type: 'video', id: '-OJDEDh-vL8', decade: '60s', category: 'Movies', title: 'Night of the Living Dead (1968)' },
      { source: 'youtube', type: 'video', id: 'b714WiZk4w', decade: '60s', category: 'Cartoons', title: 'Spider-Man 1967 Vintage Block' },
      // 1970s
      { source: 'youtube', type: 'video', id: '5qB1X_N-qOQ', decade: '70s', category: 'Movies', title: '70s Sci-Fi Drive-In Previews' },
      { source: 'youtube', type: 'video', id: 'u24B4e_bEaQ', decade: '70s', category: 'Commercials', title: '1970s Commercial Tape Compilation' },
      { source: 'youtube', type: 'video', id: 'fJ9rUzIMcZQ', decade: '70s', category: 'Music', title: 'Soul Train 70s Broadcasts' },
      // 1980s
      { source: 'youtube', type: 'video', id: 'Y-9GvQ3J48U', decade: '80s', category: 'Commercials', title: '2 Hours of 80s TV Commercials' },
      { source: 'youtube', type: 'video', id: 'n7HkG7zP7A8', decade: '80s', category: 'Cartoons', title: '80s Saturday Morning Cartoons WOC' },
      { source: 'youtube', type: 'video', id: '31JNEVHZx08', decade: '80s', category: 'News', title: 'CNN Live Berlin Wall Broadcast' }, 
      // 1990s
      { source: 'youtube', type: 'video', id: 'lO_q8T7J6yU', decade: '90s', category: 'Commercials', title: '1995 Nickelodeon WOC Block' },
      { source: 'youtube', type: 'video', id: 'hTWKbfoikeg', decade: '90s', category: 'Music', title: 'MTV 120 Minutes Retro VHS' },
      { source: 'youtube', type: 'video', id: 'E_Qxik1z_Kk', decade: '90s', category: 'Movies', title: '90s Blockbuster VHS Previews' },
      // 2000s
      { source: 'youtube', type: 'video', id: 'ZVuToMilP0A', decade: '2000s', category: 'Commercials', title: 'Adult Swim 2004 Bumps & Ads' },
      { source: 'youtube', type: 'video', id: 'MebGqH8E_B4', decade: '2000s', category: 'Cartoons', title: 'Cartoon Network City Era 2004' }
    ];

    const iaPresetCollections = [
      { name: '📼 Blockbuster VHS Tapes', query: 'vhsvault OR vhstaperecordings OR blockbuster' },
      { name: '📺 80s Commercial Blocks', query: '1980s tv commercials WOC' },
      { name: '🥣 Saturday Morning Cartoons', query: 'saturday morning cartoons vhs' },
      { name: '🎶 Retro MTV Broadcasts', query: 'mtv broadcast vhs 1980s 1990s' },
      { name: '👾 90s TV & Nickelodeon', query: '90s tv broadcast nickelodeon WOC' },
      { name: '🍿 Drive-In Movie Intermissions', query: 'drive-in movie intermission trailers' }
    ];

    const categories = ['All', 'Cartoons', 'Commercials', 'Movies', 'Music', 'News', 'VHS Vault'];
    const decades = ['50s', '60s', '70s', '80s', '90s', '2000s'];

    const mapYearToDecade = (yearStr) => {
      if (!yearStr) return '80s';
      const yr = parseInt(yearStr, 10);
      if (isNaN(yr)) return '80s';
      if (yr < 1960) return '50s';
      if (yr < 1970) return '60s';
      if (yr < 1980) return '70s';
      if (yr < 1990) return '80s';
      if (yr < 2000) return '90s';
      return '2000s';
    };

    function App() {
      const [power, setPower] = useState(false);
      const [decade, setDecade] = useState('80s');
      const [category, setCategory] = useState('All');
      const [channelIndex, setChannelIndex] = useState(0);
      const [isChangingChannel, setIsChangingChannel] = useState(false);
      const [volume, setVolume] = useState(5);
      const [showOSD, setShowOSD] = useState(false);
      const [vhsMode, setVhsMode] = useState(true);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [isPseudoFullscreen, setIsPseudoFullscreen] = useState(false);

      // Internet Archive API States
      const [archiveSearchQuery, setArchiveSearchQuery] = useState('VHS tape broadcast');
      const [archiveResults, setArchiveResults] = useState([]);
      const [isLoadingArchive, setIsLoadingArchive] = useState(false);
      const [archiveError, setArchiveError] = useState(null);
      const [showVaultModal, setShowVaultModal] = useState(false);
      const [sourceMode, setSourceMode] = useState('archive'); // 'archive' or 'curated'

      const osdTimeoutRef = useRef(null);
      const channelTimeoutRef = useRef(null);
      const screenRef = useRef(null);

      // Audio Context for Static Noise
      const audioCtxRef = useRef(null);
      const noiseSourceRef = useRef(null);
      const gainNodeRef = useRef(null);

      useEffect(() => {
        const handleFSChange = () => {
          const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
          setIsFullscreen(isFS);
          if (!isFS && window.screen && window.screen.orientation && window.screen.orientation.unlock) {
            window.screen.orientation.unlock().catch(() => {});
          }
        };

        document.addEventListener('fullscreenchange', handleFSChange);
        document.addEventListener('webkitfullscreenchange', handleFSChange);
        return () => {
          document.removeEventListener('fullscreenchange', handleFSChange);
          document.removeEventListener('webkitfullscreenchange', handleFSChange);
        };
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isPseudoFullscreen) {
            setIsPseudoFullscreen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isPseudoFullscreen]);

      const toggleFullscreen = async () => {
        if (!screenRef.current) return;
        
        if (isPseudoFullscreen) {
          setIsPseudoFullscreen(false);
          if (window.screen && window.screen.orientation && window.screen.orientation.unlock) {
            window.screen.orientation.unlock().catch(() => {});
          }
          return;
        }

        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            const elem = screenRef.current;
            let success = false;

            if (elem.requestFullscreen) {
              try {
                await elem.requestFullscreen();
                success = true;
              } catch (e) {
                console.warn("Native fullscreen denied, using viewport expansion fallback:", e);
              }
            } else if (elem.webkitRequestFullscreen) {
              try {
                await elem.webkitRequestFullscreen();
                success = true;
              } catch (e) {
                console.warn("Webkit fullscreen denied, using viewport expansion fallback:", e);
              }
            }

            if (!success) {
              setIsPseudoFullscreen(true);
            }

            if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
              await window.screen.orientation.lock('landscape').catch(() => {});
            }
          } else {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              await document.webkitExitFullscreen();
            }
            if (window.screen && window.screen.orientation && window.screen.orientation.unlock) {
              window.screen.orientation.unlock().catch(() => {});
            }
          }
        } catch (err) {
          console.error('Fullscreen / Landscape error:', err);
          setIsPseudoFullscreen(prev => !prev);
        }
      };

      const fetchInternetArchiveVault = async (searchTerm = '', targetDecade = '', targetCategory = '') => {
        setIsLoadingArchive(true);
        setArchiveError(null);

        try {
          let searchParts = [];
          
          if (searchTerm && searchTerm.trim()) {
            searchParts.push(`(${searchTerm.trim()})`);
          } else {
            searchParts.push(`(vhsvault OR vhs OR "tv broadcast" OR "commercials")`);
          }

          if (targetCategory && targetCategory !== 'All' && targetCategory !== 'VHS Vault') {
            searchParts.push(`("${targetCategory}")`);
          }

          const fullQuery = `${searchParts.join(' AND ')} AND mediatype:(movies OR video)`;
          const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(fullQuery)}&fl[]=identifier,title,description,year,downloads,publicdate&sort[]=downloads+desc&rows=40&page=1&output=json`;

          const response = await fetch(url);
          if (!response.ok) throw new Error('Failed to reach Internet Archive API');
          
          const data = await response.json();
          const docs = data.response?.docs || [];

          if (docs.length === 0) {
            setArchiveError('No tapes found matching query. Try a broader search term!');
            setArchiveResults([]);
          } else {
            const formattedResults = docs.map((docItem) => {
              const itemDecade = mapYearToDecade(docItem.year);
              return {
                source: 'archive',
                id: docItem.identifier,
                title: docItem.title || docItem.identifier,
                description: docItem.description || 'Digitized VHS Tape from Internet Archive',
                decade: itemDecade,
                category: targetCategory !== 'All' ? targetCategory : 'VHS Vault',
                year: docItem.year || 'Retro Era',
                downloads: docItem.downloads || 0,
                embedUrl: `https://archive.org/embed/${docItem.identifier}?autoplay=1`
              };
            });

            setArchiveResults(formattedResults);
            setSourceMode('archive');
            setChannelIndex(0);
          }
        } catch (err) {
          console.error('Internet Archive API error:', err);
          setArchiveError('Could not load from Internet Archive. Check your network or try again.');
        } finally {
          setIsLoadingArchive(false);
        }
      };

      useEffect(() => {
        fetchInternetArchiveVault('VHS tape broadcast 1980s', '80s', 'All');
      }, []);

      useEffect(() => {
        return () => {
          if (channelTimeoutRef.current) clearTimeout(channelTimeoutRef.current);
          if (osdTimeoutRef.current) clearTimeout(osdTimeoutRef.current);
          stopStatic();
          if (audioCtxRef.current && audioCtxRef.current.state !== 'closed') {
            audioCtxRef.current.close().catch(() => {});
          }
        };
      }, []);

      const activeChannelList = useMemo(() => {
        if (sourceMode === 'archive' && archiveResults.length > 0) {
          return archiveResults.filter(ch => 
            (category === 'All' || category === 'VHS Vault' || ch.category === category)
          );
        } else {
          return curatedChannels.filter(ch => 
            ch.decade === decade && 
            (category === 'All' || ch.category === category)
          );
        }
      }, [sourceMode, archiveResults, curatedChannels, decade, category]);

      const currentChannel = activeChannelList[channelIndex] || null;

      const initAudio = () => {
        if (!audioCtxRef.current) {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtxRef.current = new AudioContext();
            gainNodeRef.current = audioCtxRef.current.createGain();
            gainNodeRef.current.connect(audioCtxRef.current.destination);
          } catch (e) {
            console.warn("Web Audio API not supported", e);
          }
        } else if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
      };

      const playStatic = () => {
        if (!audioCtxRef.current || !gainNodeRef.current) return;
        try {
          if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
          
          const bufferSize = audioCtxRef.current.sampleRate * 2; 
          const buffer = audioCtxRef.current.createBuffer(1, bufferSize, audioCtxRef.current.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1; 
          }

          noiseSourceRef.current = audioCtxRef.current.createBufferSource();
          noiseSourceRef.current.buffer = buffer;
          noiseSourceRef.current.loop = true;
          
          const filter = audioCtxRef.current.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 5000;
          
          noiseSourceRef.current.connect(filter);
          filter.connect(gainNodeRef.current);
          
          gainNodeRef.current.gain.setValueAtTime(0.08 * (volume / 10), audioCtxRef.current.currentTime);
          noiseSourceRef.current.start();
        } catch (e) {
          console.warn("Could not play static sound", e);
        }
      };

      const stopStatic = () => {
        if (noiseSourceRef.current) {
          try {
            noiseSourceRef.current.stop();
            noiseSourceRef.current.disconnect();
          } catch (e) {}
          noiseSourceRef.current = null;
        }
      };

      const togglePower = () => {
        if (!power) {
          initAudio();
          setPower(true);
          triggerOSD();
        } else {
          setPower(false);
          stopStatic();
        }
      };

      const triggerOSD = () => {
        setShowOSD(true);
        if (osdTimeoutRef.current) clearTimeout(osdTimeoutRef.current);
        osdTimeoutRef.current = setTimeout(() => setShowOSD(false), 3500);
      };

      const playSpecificChannel = (targetChannel) => {
        initAudio();
        if (!power) setPower(true);
        
        if (targetChannel.decade) setDecade(targetChannel.decade);
        setSourceMode(targetChannel.source);

        setIsChangingChannel(true);
        playStatic();
        triggerOSD();
        
        if (channelTimeoutRef.current) clearTimeout(channelTimeoutRef.current);
        
        channelTimeoutRef.current = setTimeout(() => {
          const listToUse = targetChannel.source === 'archive' ? archiveResults : curatedChannels;
          const targetIdx = listToUse.findIndex(ch => ch.id === targetChannel.id);
          setChannelIndex(targetIdx !== -1 ? targetIdx : 0);
          setIsChangingChannel(false);
          stopStatic();
        }, 700 + Math.random() * 300);
      };

      const changeChannel = (direction) => {
        if (!power) return;
        
        initAudio();
        setIsChangingChannel(true);
        playStatic();
        triggerOSD();
        
        if (channelTimeoutRef.current) clearTimeout(channelTimeoutRef.current);
        
        channelTimeoutRef.current = setTimeout(() => {
          setChannelIndex(prev => {
            let next = prev + direction;
            if (next >= activeChannelList.length) return 0;
            if (next < 0) return activeChannelList.length - 1;
            return next;
          });
          setIsChangingChannel(false);
          stopStatic();
        }, 600 + Math.random() * 300); 
      };

      const adjustVolume = (delta) => {
        if (!power) return;
        setVolume(prev => {
          const next = Math.max(0, Math.min(10, prev + delta));
          if (gainNodeRef.current && audioCtxRef.current) {
             gainNodeRef.current.gain.setValueAtTime(0.08 * (next / 10), audioCtxRef.current.currentTime);
          }
          return next;
        });
        triggerOSD();
      };

      const getOverlayStyle = (currentDecade) => {
        switch(currentDecade) {
          case '50s': return { filter: 'grayscale(100%) sepia(30%) contrast(120%)' };
          case '60s': return { filter: 'sepia(40%) contrast(110%)' };
          case '70s': return { filter: 'sepia(20%) contrast(100%)' };
          case '80s': return { filter: 'contrast(110%) saturate(125%)' };
          case '90s': return { filter: 'contrast(100%) saturate(110%)' };
          default: return { filter: 'contrast(100%) saturate(100%)' };
        }
      };

      return (
        <div className="min-h-screen bg-[#121214] text-white flex flex-col md:flex-row p-4 md:p-8 gap-8 font-sans items-center justify-center">
          
          {/* LEFT CONTROL PANEL: Internet Archive VHS Vault Search */}
          <div className="w-full md:w-80 bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-2xl flex flex-col gap-5 max-h-[92vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-gray-800 pb-3">
              <div>
                <h1 className="text-xl font-bold flex items-center gap-2 text-yellow-400">
                  <Disc className="w-5 h-5 animate-spin" style={{ animationDuration: '6s' }} /> IA VHS Vault
                </h1>
                <p className="text-[11px] text-gray-400">Stream directly from archive.org</p>
              </div>
              <span className="text-[10px] bg-yellow-500/20 text-yellow-300 font-mono px-2 py-0.5 rounded border border-yellow-500/30">
                REST API
              </span>
            </div>

            {/* INTERNET ARCHIVE VAULT SEARCH BAR */}
            <div className="flex flex-col gap-2.5">
              <label className="text-xs font-semibold text-gray-300 uppercase tracking-wider flex items-center justify-between">
                <span>Search Internet Archive</span>
                <span className="text-[10px] text-indigo-400 font-normal">Millions of Tapes</span>
              </label>
              
              <form 
                onSubmit={(e) => {
                  e.preventDefault();
                  fetchInternetArchiveVault(archiveSearchQuery, decade, category);
                }}
                className="flex gap-2"
              >
                <div className="relative flex-1">
                  <Search className="w-4 h-4 absolute left-3 top-2.5 text-gray-400" />
                  <input
                    type="text"
                    placeholder="e.g. Blockbuster, 1988 Commercials, Cartoon..."
                    value={archiveSearchQuery}
                    onChange={(e) => setArchiveSearchQuery(e.target.value)}
                    className="w-full bg-gray-800 text-xs text-white placeholder-gray-500 rounded-lg pl-9 pr-3 py-2 border border-gray-700 focus:outline-none focus:border-yellow-500 transition-colors"
                  />
                </div>
                <button
                  type="submit"
                  disabled={isLoadingArchive}
                  className="bg-yellow-500 hover:bg-yellow-400 active:bg-yellow-600 text-black px-3 rounded-lg font-bold text-xs transition-all flex items-center justify-center disabled:opacity-50"
                >
                  {isLoadingArchive ? <Loader2 className="w-4 h-4 animate-spin" /> : 'Fetch'}
                </button>
              </form>

              {/* Quick Preset Shortcut Buttons */}
              <div className="flex flex-col gap-1.5 mt-1">
                <span className="text-[10px] text-gray-400 font-medium">Vault Collections:</span>
                <div className="flex flex-wrap gap-1.5">
                  {iaPresetCollections.map((preset, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        setArchiveSearchQuery(preset.query);
                        fetchInternetArchiveVault(preset.query, decade, category);
                      }}
                      className="text-[10px] bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white px-2 py-1 rounded-md border border-gray-700/60 transition-colors text-left"
                    >
                      {preset.name}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Source Switcher (Internet Archive vs Curated) */}
            <div className="bg-gray-800/80 p-1.5 rounded-xl border border-gray-700 flex text-xs">
              <button
                onClick={() => { setSourceMode('archive'); setChannelIndex(0); }}
                className={`flex-1 py-1.5 rounded-lg font-semibold transition-all flex items-center justify-center gap-1.5 ${
                  sourceMode === 'archive' ? 'bg-yellow-500 text-black shadow' : 'text-gray-400 hover:text-white'
                }`}
              >
                <Disc className="w-3.5 h-3.5" /> Archive Tapes ({archiveResults.length})
              </button>
              <button
                onClick={() => { setSourceMode('curated'); setChannelIndex(0); }}
                className={`flex-1 py-1.5 rounded-lg font-semibold transition-all flex items-center justify-center gap-1.5 ${
                  sourceMode === 'curated' ? 'bg-indigo-600 text-white shadow' : 'text-gray-400 hover:text-white'
                }`}
              >
                <Tv className="w-3.5 h-3.5" /> Broadcasts ({curatedChannels.length})
              </button>
            </div>

            {/* Era & Genre Quick Filters */}
            <div className="flex flex-col gap-2">
              <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Era Filters</h3>
              <div className="grid grid-cols-3 gap-1.5">
                {decades.map((d) => (
                  <button
                    key={d}
                    onClick={() => {
                      setDecade(d);
                      if (sourceMode === 'archive') {
                        fetchInternetArchiveVault(archiveSearchQuery, d, category);
                      }
                    }}
                    className={`py-1.5 text-xs font-bold rounded-lg transition-colors border ${
                      decade === d 
                        ? 'bg-yellow-500/20 text-yellow-300 border-yellow-500/50' 
                        : 'bg-gray-800 text-gray-400 border-gray-700/50 hover:bg-gray-700'
                    }`}
                  >
                    {d}
                  </button>
                ))}
              </div>
            </div>

            {/* Open Full Vault Directory */}
            <button 
              onClick={() => setShowVaultModal(true)} 
              className="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-indigo-300 hover:text-white py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow-md"
            >
              <Clapperboard className="w-4 h-4 text-indigo-400" /> Open Full Tape Directory Modal
            </button>
          </div>

          {}
          <div className="flex-1 flex flex-col items-center justify-center max-w-4xl w-full">
            <div className="w-full bg-[#3a2212] border-[#24140a] border-[14px] rounded-[36px] shadow-2xl p-6 relative overflow-hidden woodgrain">
              
              <div className="flex flex-col md:flex-row gap-6 items-center">
                
                {/* Screen Box with Fullscreen Reference */}
                <div 
                  ref={screenRef}
                  className={`flex-1 w-full aspect-[4/3] rounded-[28px] border-[#111] border-[12px] bg-black overflow-hidden relative shadow-inner crt-scanlines vhs-tracking ${
                    isPseudoFullscreen ? 'pseudo-fullscreen' : ''
                  }`}
                >
                  
                  {/* VIDEO PLAYER (Archive.org iframe embed or YouTube) */}
                  {!isChangingChannel && power && currentChannel && (
                    <div className="w-full h-full relative z-10" style={getOverlayStyle(decade)}>
                      <iframe
                        className="w-full h-full pointer-events-auto"
                        src={currentChannel.source === 'archive'
                          ? currentChannel.embedUrl
                          : `https://www.youtube.com/embed/${currentChannel.id}?autoplay=1&controls=1&modestbranding=1&rel=0`
                        }
                        title="Retro TV Player"
                        frameBorder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                        allowFullScreen
                      ></iframe>
                    </div>
                  )}

                  {/* Fallback Screen when no results are found */}
                  {!isChangingChannel && power && !currentChannel && (
                    <div className="w-full h-full flex flex-col items-center justify-center bg-blue-950 text-white p-6 text-center vcr-font z-10">
                      <Disc className="w-12 h-12 text-yellow-400 mb-3 animate-spin" />
                      <h3 className="text-xl font-bold text-yellow-400 mb-1">NO VHS TAPE FOUND</h3>
                      <p className="text-xs text-gray-300 max-w-sm">Use the search box on the left to query Internet Archive for vintage broadcasts or tapes.</p>
                    </div>
                  )}

                  {/* Static Noise Overlay during channel changes or powered off */}
                  {(!power || isChangingChannel || isLoadingArchive) && (
                    <div className="absolute inset-0 z-20 static-noise mix-blend-screen pointer-events-none flex items-center justify-center">
                      {isLoadingArchive && (
                        <div className="bg-black/80 px-4 py-2 rounded-lg border border-yellow-500/50 flex items-center gap-3 text-yellow-400 vcr-font text-sm animate-pulse z-30">
                          <Loader2 className="w-5 h-5 animate-spin" /> FETCHING VHS FROM ARCHIVE.ORG...
                        </div>
                      )}
                    </div>
                  )}

                  {/* OSD (On Screen Display VCR Style) */}
                  {power && showOSD && (
                    <div className="absolute top-6 left-8 z-30 text-[#0f0] vcr-font text-xl md:text-3xl pointer-events-none flex flex-col gap-1">
                      <div className="flex items-center gap-2">
                        <span className="animate-pulse">● PLAY</span>
                        <span className="text-xs border border-[#0f0] px-1 rounded">SP</span>
                      </div>
                      <div className="text-sm md:text-lg">CH {String(channelIndex + 1).padStart(2, '0')}</div>
                      <div className="text-xs md:text-sm">VOL {Array(volume).fill('I').join('')}</div>
                      <div className="text-xs md:text-sm text-yellow-300 max-w-xs truncate mt-2">
                        {currentChannel ? currentChannel.title : 'NO TAPE LOADED'}
                      </div>
                      {currentChannel?.source === 'archive' && (
                        <div className="text-[10px] text-cyan-300">INTERNET ARCHIVE • {currentChannel.year}</div>
                      )}
                    </div>
                  )}

                  {/* Fullscreen Landscape Toggle Button Overlay */}
                  <button
                    type="button"
                    onClick={(e) => {
                      e.stopPropagation();
                      toggleFullscreen();
                    }}
                    className="absolute top-4 right-4 z-50 bg-black/70 hover:bg-black/95 text-white p-2.5 rounded-xl border border-white/30 transition-all cursor-pointer shadow-xl active:scale-95 hover:scale-105 pointer-events-auto flex items-center justify-center"
                    title="Toggle Landscape Fullscreen Mode"
                  >
                    {isFullscreen || isPseudoFullscreen ? (
                      <Minimize className="w-5 h-5 text-yellow-400" />
                    ) : (
                      <Maximize className="w-5 h-5 text-white" />
                    )}
                  </button>
                </div>

                {}
                <div className="flex flex-row md:flex-col items-center justify-around gap-6 bg-black/40 p-4 rounded-2xl border border-white/10 w-full md:w-28">
                  {/* Power / Volume Knob */}
                  <div className="flex flex-col items-center gap-1.5">
                    <button 
                      onClick={() => { if (!power) togglePower(); else adjustVolume(1); }}
                      onContextMenu={(e) => { e.preventDefault(); adjustVolume(-1); }}
                      className="rounded-full bg-gradient-to-b from-gray-200 to-gray-400 border-gray-600 border-4 shadow-xl w-14 h-14 flex items-center justify-center cursor-pointer active:scale-95 transition-transform"
                      title="Click: Power/Vol Up | Right-Click: Vol Down"
                    >
                      <Power className={`w-6 h-6 ${power ? 'text-red-600' : 'text-gray-700'}`} />
                    </button>
                    <span className="text-[10px] uppercase font-bold text-gray-300 tracking-wider">PWR / VOL</span>
                  </div>

                  {/* Channel Selector Knob */}
                  <div className="flex flex-col items-center gap-1.5">
                    <button 
                      onClick={() => changeChannel(1)}
                      onContextMenu={(e) => { e.preventDefault(); changeChannel(-1); }}
                      className="rounded-full bg-gradient-to-b from-gray-200 to-gray-400 border-gray-600 border-4 shadow-xl w-14 h-14 flex items-center justify-center cursor-pointer active:scale-95 transition-transform"
                      title="Click: Next Tape | Right-Click: Prev Tape"
                    >
                      <div className="w-1 h-5 bg-red-600 rounded-full" />
                    </button>
                    <span className="text-[10px] uppercase font-bold text-gray-300 tracking-wider">CHANNEL</span>
                  </div>

                  {/* Quick Channel Up/Down & Fullscreen */}
                  <div className="flex md:flex-col gap-2">
                    <button onClick={() => changeChannel(1)} className="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg border border-gray-600 text-gray-200 active:bg-gray-900" title="Channel Up">
                      <ChevronUp className="w-4 h-4" />
                    </button>
                    <button onClick={() => changeChannel(-1)} className="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg border border-gray-600 text-gray-200 active:bg-gray-900" title="Channel Down">
                      <ChevronDown className="w-4 h-4" />
                    </button>
                    <button 
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        toggleFullscreen();
                      }} 
                      className="bg-yellow-500 hover:bg-yellow-400 text-black p-2 rounded-lg border border-yellow-600 font-bold active:bg-yellow-600 cursor-pointer pointer-events-auto" 
                      title="Landscape Fullscreen"
                    >
                      {isFullscreen || isPseudoFullscreen ? <Minimize className="w-4 h-4" /> : <Maximize className="w-4 h-4" />}
                    </button>
                  </div>
                </div>
              </div>

              <div className="mt-4 pt-3 border-t border-black/30 flex items-center justify-between text-xs text-gray-400">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                  <span className="font-mono text-[11px] text-gray-300">
                    {currentChannel ? `Playing: ${currentChannel.title}` : 'Ready for input'}
                  </span>
                </div>
                <span className="text-[10px] font-mono tracking-widest text-gray-500">SOLID STATE CRT-2000</span>
              </div>
            </div>
          </div>

          {}
          {showVaultModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                
                <div className="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-900">
                  <div className="flex items-center gap-2">
                    <Disc className="w-5 h-5 text-yellow-400" />
                    <h2 className="text-lg font-bold text-white">Internet Archive VHS Directory</h2>
                    <span className="text-xs bg-yellow-500/20 text-yellow-300 px-2.5 py-0.5 rounded-full border border-yellow-500/30 font-mono">
                      {activeChannelList.length} Tapes Loaded
                    </span>
                  </div>
                  <button 
                    onClick={() => setShowVaultModal(false)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 overflow-y-auto flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {activeChannelList.map((ch) => (
                    <div 
                      key={ch.id}
                      onClick={() => {
                        playSpecificChannel(ch);
                        setShowVaultModal(false);
                      }}
                      className="p-3 bg-gray-800/60 hover:bg-yellow-950/30 border border-gray-700/60 hover:border-yellow-500/50 rounded-xl cursor-pointer transition-all flex items-center justify-between group shadow-sm"
                    >
                      <div className="flex flex-col pr-3 min-w-0">
                        <span className="text-sm font-semibold text-gray-100 group-hover:text-yellow-300 truncate">{ch.title}</span>
                        <div className="flex items-center gap-2 mt-1 text-xs text-gray-400">
                          <span className="bg-gray-700/80 px-2 py-0.5 rounded text-[10px] font-mono text-gray-300">{ch.decade}</span>
                          <span>•</span>
                          <span className="text-gray-400">{ch.source === 'archive' ? `Year: ${ch.year}` : ch.category}</span>
                          {ch.downloads > 0 && (
                            <span className="text-[10px] text-gray-500 flex items-center gap-1">
                              <Eye className="w-3 h-3" /> {ch.downloads}
                            </span>
                          )}
                        </div>
                      </div>
                      <button className="bg-yellow-500 group-hover:bg-yellow-400 text-black p-2 rounded-lg opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all flex-shrink-0 font-bold">
                        <Play className="w-4 h-4 fill-black" />
                      </button>
                    </div>
                  ))}
                </div>

                <div className="p-3 border-t border-gray-800 bg-gray-950 text-xs text-gray-400 text-center">
                  Click any item to load the tape directly into the CRT TV player.
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
